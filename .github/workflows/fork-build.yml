name: fork build (gadget fix)

on:
  push:
    branches: [fix/gadget-thread-safety]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore application packages
        run: dotnet restore LibreHardwareMonitor\LibreHardwareMonitor.csproj

      - name: Build application
        run: dotnet build LibreHardwareMonitor\LibreHardwareMonitor.csproj -c Release --no-restore -p:Platform=x64

      - name: Upload net472 application
        uses: actions/upload-artifact@v4
        with:
          name: LibreHardwareMonitor-gadgetfix
          path: bin/Release/net472

      - name: Upload net10.0 application
        uses: actions/upload-artifact@v4
        with:
          name: LibreHardwareMonitor-gadgetfix (.NET 10)
          path: bin/Release/net10.0-windows
